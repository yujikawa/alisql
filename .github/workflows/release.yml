name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: tar czf alisql-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release alisql

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/alisql.exe -DestinationPath alisql-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: alisql-${{ matrix.target }}
          path: alisql-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            alisql-*.tar.gz alisql-*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
