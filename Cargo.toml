[package]
name = "alisql"
version = "0.2.0"
authors= ["yujikawa"]
description = "Analyze SQL"
license = "Apache-2.0"
edition = "2021"
exclude = [".github"]
repository = "https://github.com/yujikawa/alisql"

[lib]
name = "alisql"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
minijinja = "2"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
